name: RomanVoice CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: romanvoice-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.12 tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Compile Python sources
        run: uv run python -m compileall config.py services transcriber ui_qt scripts

      - name: Run test suite
        run: uv run pytest

  android:
    name: Android debug APK
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Android SDK components
        shell: pwsh
        run: |
          $sdkManager = Join-Path $env:ANDROID_HOME "cmdline-tools\latest\bin\sdkmanager.bat"
          & $sdkManager "platforms;android-35" "build-tools;35.0.0"
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed with $LASTEXITCODE" }

      - name: Build and verify Android APK
        shell: pwsh
        run: .\clients\android-ime\build-debug-apk.ps1
